<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Hard carbon / pre-sodiation</title><desc>补充钠库存的负极，与未经处理硬碳区分. Qualitative source-based schematic; not a micrograph or a measured specimen.</desc><rect width="960" height="600" fill="#111314"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="65" y="80" fill="#e7e5df" font-size="42" text-anchor="start">硬碳 / 预钠化</text><text x="480" y="240" fill="#cfa478" font-size="42" text-anchor="middle">硬碳 + Na</text><path d="M400,305 L560,305" fill="none" stroke="#e5e1d9" stroke-width="5"/><polygon points="560,305 540,290 540,320" fill="#e5e1d9"/><text x="480" y="395" fill="#91b9a2" font-size="42" text-anchor="middle">预钠化硬碳</text></g></svg>