<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Cd(O,S) / precursor</title><desc>Cd(O,S) is a pre-anneal window precursor; annealing forms an intermixed region. Qualitative source-based schematic; not a micrograph or a measured specimen.</desc><rect width="960" height="600" fill="#111314"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="65" y="80" fill="#e7e5df" font-size="42" text-anchor="start">Cd(O,S) / precursor</text><text x="85" y="175" fill="#cfa478" font-size="32" text-anchor="start">Before annealing</text><rect x="90" y="215" width="285" height="70" rx="0" fill="#88acbe"/><text x="232" y="262" fill="#141717" font-size="31" text-anchor="middle">Cd(O,S)</text><rect x="90" y="300" width="285" height="90" rx="0" fill="#91b9a2"/><text x="232" y="357" fill="#141717" font-size="26" text-anchor="middle">CdSe:O precursor</text><path d="M415,300 L530,300" fill="none" stroke="#e4dfd5" stroke-width="4"/><polygon points="530,300 510,285 510,315" fill="#e4dfd5"/><text x="720" y="175" fill="#91b9a2" font-size="32" text-anchor="start">After annealing</text><rect x="580" y="215" width="285" height="175" rx="0" fill="#456b5c"/><text x="720" y="288" fill="#e6e4dc" font-size="32" text-anchor="middle">Cd(Se,Te)</text><text x="720" y="345" fill="#e6e4dc" font-size="28" text-anchor="middle">Intermixed region</text></g></svg>