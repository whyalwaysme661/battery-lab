<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>EMD / graphite ring</title><desc>An annular MnO2/graphite cathode surrounds the separator and zinc gel. Qualitative source-based schematic; not a micrograph or a measured specimen.</desc><rect width="960" height="600" fill="#111314"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="65" y="80" fill="#e7e5df" font-size="42" text-anchor="start">EMD / graphite ring</text><circle cx="390" cy="295" r="151" fill="#718c80"/><circle cx="390" cy="295" r="101" fill="#d4c7af"/><circle cx="390" cy="295" r="88" fill="#485858"/><rect x="615" y="210" width="30" height="15" rx="0" fill="#91b9a2"/><text x="670" y="226" fill="#e7e5df" font-size="29" text-anchor="start">MnO₂ + graphite</text><rect x="615" y="287" width="30" height="15" rx="0" fill="#d4c7af"/><text x="670" y="303" fill="#e7e5df" font-size="29" text-anchor="start">Separator</text><rect x="615" y="364" width="30" height="15" rx="0" fill="#485858"/><text x="670" y="380" fill="#e7e5df" font-size="29" text-anchor="start">Zn gel</text><text x="390" y="500" fill="#dad7cc" font-size="30" text-anchor="middle">Annular cathode cross-section</text></g></svg>